version: '3.8'

services:
  nextjs-dev:
    build:
      context: .
      target: development
    container_name: nextjs-dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true # Ensures hot-reload works smoothly inside containers

  # Production Environment (Optimized Stack)
  nextjs-prod:
    build:
      context: .
      target: runner
    container_name: nextjs-prod
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
